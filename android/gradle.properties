org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.daemon=true
org.gradle.parallel=false
# Incremental Kotlin caches fail on Windows when the project is on D: and
# pub-cache plugins are on C: ("this and base files have different roots").
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# Plugins disagree on Java vs Kotlin JVM targets (11/17/21). Don't fail the build.
kotlin.jvm.target.validation.mode=warning
android.useAndroidX=true
android.enableJetifier=true
